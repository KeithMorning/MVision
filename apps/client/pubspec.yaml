name: mvision_client
description: MVision cross-platform AI knowledge client.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  crypto: ^3.0.3
  file_picker: ^8.0.0
  markdown: ^7.2.0
  url_launcher: ^6.2.0
  dio: ^5.4.0
  design_system:
    path: ../../packages/design_system
  knowledge_core:
    path: ../../packages/knowledge_core
  platform_api:
    path: ../../packages/platform_api
  flutter_markdown_plus: ^1.0.12
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true

msix_config:
  display_name: MVision
  publisher_display_name: MVision
  identity_name: com.mvision.client
  msix_version: 1.0.0.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
  description: MVision - Cross-platform AI Knowledge Client
  languages: en-us, zh-cn
